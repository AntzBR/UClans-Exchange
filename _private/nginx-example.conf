# Inclua estas diretivas DENTRO do server {} para o seu dominio.
# Nginx nao le .htaccess. ADAPTE o caminho do PHP-FPM e document root.
location ^~ /exchange/_private/ { return 404; }
location = /exchange/index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/exchange/index.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_read_timeout 300s;
}
location /exchange/ {
    index index.php;
    try_files $uri $uri/ =404;
}
# No nivel server, definir client_max_body_size 110m;.
