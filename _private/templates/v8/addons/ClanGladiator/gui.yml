 
 
# CHEST GUI
 
 
Gladiator:
  #Lock Gladiator config
  glad_view:
    opensound: block.slime_block.hit:1.0:1.0
    rows: 5
    items:
      fill:
        # Use ; "<ITEM>;<ITEM>;<ITEM>" to add more than one item to the fill.
        material: BLUE_STAINED_GLASS_PANE
        amount: 1
        glow: false
        nbt:
          string:
          - example:example_nbt_string
          integer:
          - CustomModelData:00000001
        # This option can be applied to all items.
        mimeslots:
        - BOTTOM
      fill2:
        # Use ; "<ITEM>;<ITEM>;<ITEM>" to add more than one item to the fill.
        material: GRAY_STAINED_GLASS_PANE
        amount: 1
        glow: false
        mimeslots:
        - ALL
      actives:
        clicksound: ''
        material: DIAMOND_SWORD
        amount: 1
        glow: true
        # %player%, nicknames or base64Textures
        texture: ''
        slot: 20
