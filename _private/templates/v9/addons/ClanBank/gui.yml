 
Bank:
  home_bank:
    opensound: block.slime_block.hit:1.0:1.0
    # Make sure the item slot does not exceed the number of slots
    rows: 5
    items:
      fill:
        material: BLUE_STAINED_GLASS_PANE
        amount: 1
        glow: false
        # This option can be applied to all items.
        enabled: true
        # This option can be applied to all items.
        mimeslots:
        - ALL
         # Nbts can be applied to all items in all menus by following this example
        # With support for ItemsAdder you can add nbt ex 'ItemsAdder:item_name' or 'HideTooltip:true' to add custom items to gui menus
        nbt:
          string:
          - ItemsAdder:item_name
        # Used for CustomModelData options, just add the number. This option can be applied to all items.
        model: 0
