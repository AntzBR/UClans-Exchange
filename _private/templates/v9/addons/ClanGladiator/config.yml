# ClanGladiator configuration generated by EConfig.
file-version: 6
 
# Main event behavior.
General:
  timezone: America/Sao_Paulo
  debug: false
  allow-multiple-events: true
  prevent-non-participants-in-arena: true
  disconnect-grace-seconds: 30
  lobby-radius: 8.0
  restore-health-on-exit: true
  teleport-to-arena-exit: true
  allowed-commands:
  - glad
  - gladiator
  - msg
  - tell
  - r
  arena-rules:
    allow-block-break: false
    allow-block-place: false
    allow-item-drop-in-own-items-mode: true
    allow-item-pickup-in-own-items-mode: true
    # REGENERATE stores only changed blocks. New changes are blocked after this safe limit.
    regeneration-max-changed-blocks: 50000
 
# Values copied into newly-created arenas.
Default-Arena:
  enabled: false
  display-name: <red><bold>{arena}</bold></red>
  icon: DIAMOND_SWORD
  # SERVER_KIT or OWN_ITEMS.
  mode: SERVER_KIT
  kit: default
  min-clans: 2
  max-clans: 8
  max-players-per-clan: 10
  recruitment-seconds: 120
  countdown-seconds: 10
  max-duration-seconds: 900
  shrink-at-remaining-seconds: 300
  final-border-size: 12.0
  finishing-seconds: 3
  # MOST_PLAYERS_THEN_KILLS, MOST_KILLS_THEN_PLAYERS or DRAW.
  timeout-resolution: MOST_PLAYERS_THEN_KILLS
  # NORMAL, INDESTRUCTIBLE or REGENERATE.
  protection-mode: INDESTRUCTIBLE
 
# Inventory isolation and recovery rules.
Server-Kit:
  force-survival: true
  clear-potion-effects-on-entry: true
  require-empty-storage: true
  require-empty-armor: true
  require-empty-offhand: true
  require-empty-cursor: true
  block-inventory-containers: true
  block-item-drop: true
  block-item-pickup: true
 
# Optional PacketEvents border supplied by EntityWizard.
WorldBorder:
  # If EntityWizard is absent, only the visual border is disabled; the event keeps running.
  enabled: true
  warning-distance: 5
  warning-time: 10
  portal-teleport-boundary: 29999984
 
Rewards:
  recipient-scope: ALL_WINNING_PARTICIPANTS
  run-commands-for-offline-players: true
  drop-overflow-items-at-exit: true
 
Scheduler:
  enabled: true
  check-interval-seconds: 30
 
Visuals:
  scoreboard:
    enabled: true
  bossbar:
    enabled: true
    color: RED
    overlay: PROGRESS
  actionbar:
    enabled: true
   
  announcements:
    recruitment:
      enabled: true
      title: true
      actionbar: true
      bossbar: true
      sound: ENTITY_ENDER_DRAGON_GROWL:1.0:1.0
      bossbar-color: RED
      bossbar-overlay: PROGRESS
      # Total number of recruitment announcements. 1 preserves the original single-announcement behavior.
      repeats: 1
      # Delay between repeated recruitment announcements when repeats is greater than 1.
      repeat-interval-seconds: 10
 
# Optional isolated spectator mode.
Spectator:
  enabled: true
  allow-external-players: true
  allow-eliminated-players: true
 
# Optional clan-leader confirmation during recruitment.
Lineup:
  require-leader-confirmation: false
 
# Persistent event history and clan statistics.
History:
  enabled: true
  max-records: 250
Config:
   
  # Icon inserted in the UClans clan-home GUI.
  Icon:
    click_sound: UI_BUTTON_CLICK:1.0:1.0
    material: DIAMOND_AXE
    name: <red><bold>Clan Gladiator</bold></red>
    texture: ''
    lore:
    - <gray>Competitive clan events.</gray>
    - ''
    - <red>Click to open.</red>
    glow: true
    slot: 33
    page: clan_home
    # available: TOP, BOTTOM, BORDER, ALL or numeric list
    mimeslots: [
      ]
    nbt:
      string: [
        ]
    model: 0
    left_click_action:
    - /{_clan} {_glad}
    right_click_action:
    - /{_clan} {_glad}
 
# Persistent addon data: YAML, SQLITE or MYSQL.
Storage:
  type: YAML
  mysql:
    host: localhost
    port: 3306
    database: uclans
    user: root
    password: ''
    useSSL: false
  table: uclans_gladiator_data
