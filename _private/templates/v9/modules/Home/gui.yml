        amount: 1
        glow: false
        mimeslots:
        - ALL
      confirm:
        clicksound: ''
        material: DIAMOND_BLOCK
        amount: 1
        glow: true
        slot: 10
        mimeslots:
        - 11
        - 12
      cancel:
        clicksound: ''
        material: REDSTONE_BLOCK
        amount: 1
        glow: true
